name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The API integration tests run against a real Postgres (they create a pland_test database).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pland
          POSTGRES_PASSWORD: pland
          POSTGRES_DB: pland
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pland"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PLAND_DB: Host=localhost;Port=5432;Database=pland;Username=pland;Password=pland;Gss Encryption Mode=Disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Building the API regenerates web/src/api/PlanD.Api.json from the endpoints.
      - run: dotnet build src/PlanD.Api
      - name: Types match the API, then build
        working-directory: web
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code src/api
          npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app image
        run: docker build -t kitchen-table:ci .
